name: Bug report
description: Something in the Grunz desktop app is broken or not working right
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Grunz never stores your chats, so please paste anything
        relevant (error text, a screenshot) here yourself.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Grunz version
      description: "Shown in the app's top bar, e.g. 1.1.33"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Error text or screenshot (optional)
      description: Paste any on-screen error message, or drag in a screenshot.
